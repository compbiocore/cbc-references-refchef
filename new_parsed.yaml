cellranger_GRCh38:
  metadata:
    name: cellranger_GRCh38
    common_name: human
    custom: 'No'
    description: Human reference (GRCh38) dataset required for Cell Ranger.
    downloader: joselynn wallace
    ncbi_taxon_id: null
    ensembl_release_number: null
    accession:
      genbank: none
      refseq: none
    organism: Homo sapiens
    organization: 10x
    category: genomics
  levels:
    references:
    - component: primary
      complete:
        status: 'false'
      commands:
      - wget "https://cf.10xgenomics.com/supp/cell-exp/refdata-gex-GRCh38-2024-A.tar.gz"
      - tar -xzf refdata-gex-GRCh38-2024-A.tar.gz
      - md5sum *.* > final_checksums.md5
